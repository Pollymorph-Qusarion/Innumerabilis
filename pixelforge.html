<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixelforge Studio</title>
<style>
:root{--bg:#1b1b1d;--p:#2a2a2d;--p2:#232326;--b:#111;--t:#d9d9dc;--t2:#9a9aa0;--a:#4c8dff;--ru:18px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:12px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:var(--t);background:#3a3a3f;border:1px solid #4a4a50;border-radius:4px;padding:3px 9px;cursor:pointer;white-space:nowrap}
button:hover{background:#45454b}
button.pri{background:var(--a);border-color:var(--a);color:#fff}
button.ib{padding:2px 6px;min-width:24px}
button.on{background:#55607a;border-color:#7a8bb0}
input,select{font:inherit;color:var(--t);background:#1c1c1f;border:1px solid #444;border-radius:3px;padding:2px 4px}
input[type=range]{padding:0;accent-color:var(--a);width:84px}
input[type=number]{width:62px}
input.n{width:52px;text-align:right}
input[type=checkbox],input[type=radio]{accent-color:var(--a)}
#menubar{display:flex;align-items:center;height:30px;background:var(--p);border-bottom:1px solid var(--b);flex:none;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#logo{width:46px;flex:none;display:grid;place-items:center}
#menus{display:flex}
.menu{padding:0 10px;height:30px;line-height:30px;cursor:default;flex:none}
.menu:hover,.menu.open{background:#3d3d42}
.drop{display:none;position:fixed;min-width:260px;background:#2f2f33;border:1px solid #111;border-radius:0 0 6px 6px;box-shadow:0 8px 24px #000a;padding:4px 0;max-height:calc(100dvh - 40px);overflow:auto;z-index:90;line-height:1.3}
.menu.open .drop{display:block}
.mi{display:flex;justify-content:space-between;gap:24px;padding:4px 16px;white-space:nowrap}
.mi:hover{background:var(--a);color:#fff}
.mi kbd{font:inherit;color:var(--t2)}.mi:hover kbd{color:#fff}
.mi.chk span::before{content:'✓ ';}.mi.unchk span::before{content:'✓ ';visibility:hidden}
.msep{height:1px;background:#444;margin:4px 0}
.mh{padding:6px 16px 2px;color:var(--t2);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
#ptoggle{margin-left:auto;margin-right:8px;display:none;flex:none}
#options{display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;background:var(--p2);border-bottom:1px solid var(--b);flex:none;overflow-x:auto;white-space:nowrap}
#options label{display:flex;align-items:center;gap:5px;color:var(--t2)}
#options .tname{font-weight:600;color:var(--t);min-width:96px}
#options .grp{display:flex;gap:3px;align-items:center}
#options .sep{width:1px;height:22px;background:#3a3a3e}
.v{color:var(--t);min-width:34px;font-variant-numeric:tabular-nums}
.hint{color:var(--t2)}
#tabs{display:flex;height:28px;background:#1f1f22;border-bottom:1px solid var(--b);flex:none;overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;border-right:1px solid #111;color:var(--t2);cursor:pointer;white-space:nowrap;max-width:280px;flex:none}
.tab .tn{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--bg);color:#fff;box-shadow:inset 0 2px 0 var(--a)}
.tab .x{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;opacity:.6}
.tab .x:hover{background:#ffffff22;opacity:1}
#main{flex:1;display:flex;min-height:0}
#tools{width:48px;flex:none;background:var(--p2);border-right:1px solid var(--b);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;overflow-y:auto;scrollbar-width:none}
.tool{position:relative;width:36px;height:30px;flex:none;display:grid;place-items:center;border-radius:5px;color:#c8c8cc;cursor:pointer}
.tool:hover{background:#38383d}
.tool.on{background:#4a4a52;color:#fff;box-shadow:inset 0 0 0 1px #5c5c66}
.tool.grp::after{content:'';position:absolute;right:3px;bottom:3px;border:3px solid transparent;border-right-color:#999;border-bottom-color:#999}
.tool svg,.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tsep{width:26px;height:1px;background:#3a3a3e;margin:3px 0;flex:none}
#flyout{position:fixed;z-index:95;background:#2f2f33;border:1px solid #111;border-radius:6px;box-shadow:0 8px 24px #000a;padding:4px 0;display:none}
#flyout .fi{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 8px;cursor:pointer;white-space:nowrap}
#flyout .fi:hover{background:var(--a);color:#fff}
#flyout .fi kbd{margin-left:auto;padding-left:20px;color:var(--t2);font:inherit}
#fgbg{position:relative;width:38px;height:42px;flex:none;margin-top:8px}
#fgbg .sw{position:absolute;width:22px;height:22px;border:1px solid #000;box-shadow:0 0 0 1px #888;cursor:pointer}
#tfg{left:2px;top:2px;z-index:2}#tbg{left:13px;top:15px}
#qmbtn{margin-top:6px;width:30px;height:24px;display:grid;place-items:center;border-radius:4px;cursor:pointer;color:#bbb;flex:none}
#qmbtn.on{background:#a33;color:#fff}
#wrap{flex:1;position:relative;min-width:0;overflow:hidden}
#viewport{position:absolute;inset:0;overflow:auto;touch-action:none;background:var(--bg)}
body.rulers #viewport{top:var(--ru);left:var(--ru)}
#rulerT,#rulerL{position:absolute;display:none;z-index:4;cursor:default}
body.rulers #rulerT{display:block;left:var(--ru);right:0;top:0;height:var(--ru);cursor:s-resize}
body.rulers #rulerL{display:block;top:var(--ru);bottom:0;left:0;width:var(--ru);cursor:e-resize}
#stage{display:flex;width:max-content;height:max-content;min-width:100%;min-height:100%;padding:80px}
#view{margin:auto;flex:none;display:block;background:repeating-conic-gradient(#c8c8c8 0 25%,#fff 0 50%) 0 0/16px 16px;box-shadow:0 0 0 1px #000,0 6px 30px #000c}
#overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
#textbox{position:absolute;z-index:5;background:transparent;border:1px dashed var(--a);outline:none;resize:none;padding:0;margin:0;overflow:hidden;white-space:pre;min-width:30px;user-select:text;-webkit-user-select:text}
#panels{width:280px;flex:none;background:var(--p2);border-left:1px solid var(--b);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.panel{border-bottom:1px solid var(--b);display:flex;flex-direction:column;min-height:0;flex:none}
.panel.hidden{display:none}
.ph{padding:5px 10px;background:var(--p);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#bbb;cursor:pointer;display:flex;justify-content:space-between}
.ph::after{content:'▾';opacity:.6}
.panel.col .ph::after{content:'▸'}
.panel.col>:not(.ph){display:none!important}
.pc{padding:8px 10px}
#colorPanel{display:flex;gap:10px;align-items:flex-start}
#cbig{position:relative;width:54px;height:54px;flex:none}
#cbig .sw{position:absolute;width:34px;height:34px;border:1px solid #000;box-shadow:0 0 0 1px #999;cursor:pointer}
#cfg{left:0;top:0;z-index:2}#cbg{left:18px;top:18px}
#swatches{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
#swatches div{aspect-ratio:1;border:1px solid #0006;cursor:pointer}
#swatches .add{display:grid;place-items:center;color:#aaa;background:#333;font-size:11px}
.csl{display:grid;grid-template-columns:14px 1fr 40px;gap:4px;align-items:center;margin-top:6px}
.csl input[type=range]{width:100%}
#navc{width:100%;display:block;background:#111;cursor:pointer;touch-action:none}
#histc{width:100%;height:80px;display:block;background:#161618}
#info{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 8px;font-variant-numeric:tabular-nums}
#info b{color:var(--t2);font-weight:normal}
.list{overflow-y:auto}
#histPanel .list{max-height:130px}
.hrow{padding:3px 6px;cursor:pointer;border-bottom:1px solid #2c2c30;display:flex;gap:6px;align-items:center}
.hrow .hs{width:14px;height:14px;border:1px solid #555;border-radius:2px;flex:none;display:grid;place-items:center;font-size:10px}
.hrow.on{background:#3a4a6a}.hrow.fut{color:#666}
#layerPanel{flex:1 0 300px}
#layerPanel .list{flex:1;min-height:120px}
.lctl{display:flex;gap:6px;align-items:center;padding:5px 8px;border-bottom:1px solid #333;flex-wrap:wrap}
.lctl select{flex:1;min-width:0}
.lctl input[type=range]{width:64px}
.lrow{display:flex;align-items:center;gap:5px;padding:3px 6px;border-bottom:1px solid #2c2c30;cursor:pointer}
.lrow.on{background:#3a4a6a}
.lrow.pk:not(.on){background:#2f3a52}
.fxb{font:italic bold 10px serif;color:#ccc;border:1px solid #666;border-radius:3px;padding:0 3px;cursor:pointer}.fxb.off{opacity:.35}
#flyout .fi.dis{opacity:.4;cursor:default}#flyout .fi.dis:hover{background:none;color:inherit}#flyout .msep{height:1px;background:#444;margin:4px 0}
#pnPaths .list{max-height:160px}
.lrow.dragover{box-shadow:inset 0 2px 0 var(--a)}
.lrow canvas{width:40px;height:30px;flex:none;background:repeating-conic-gradient(#bbb 0 25%,#fff 0 50%) 0 0/8px 8px;border:1px solid #000}
.lrow canvas.sel{outline:2px solid #fff;outline-offset:1px}
.lrow canvas.mk{background:#000}
.lrow canvas.off{opacity:.35}
.lrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .bm{color:var(--t2);font-size:10px}
.lrow .tt{width:40px;height:30px;flex:none;border:1px solid #000;display:grid;place-items:center;background:#ddd;color:#222;font:bold 16px serif}
.eye{width:20px;height:22px;display:grid;place-items:center;color:#ccc}
.eye.off{opacity:.2}
.lbtns{display:flex;gap:3px;padding:5px;justify-content:flex-end;border-top:1px solid #333;flex-wrap:wrap}
.lbtns button{padding:3px 6px}
#status{height:24px;flex:none;background:var(--p);border-top:1px solid var(--b);display:flex;gap:16px;align-items:center;padding:0 10px;color:var(--t2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
#zin{width:70px;height:18px;padding:0 4px;text-align:right}
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:56px;background:#0004}
.dlg{background:#2c2c30;border:1px solid #111;border-radius:8px;box-shadow:0 20px 60px #000c;min-width:330px;max-width:96vw;max-height:88dvh;display:flex;flex-direction:column}
.dlg h3{margin:0;padding:10px 14px;font-size:13px;border-bottom:1px solid #1a1a1a;cursor:move;touch-action:none}
.dbody{padding:12px 14px;overflow:auto;display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.dbody input[type=range]{width:100%;min-width:140px}
.dbody .full{grid-column:1/-1}
.dbody table{border-collapse:collapse;width:100%}.dbody td{padding:2px 8px;border-bottom:1px solid #383838}
.dbtn{display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;border-top:1px solid #1a1a1a;align-items:center}
.dbtn .pv{margin-right:auto;display:flex;gap:5px;align-items:center;color:var(--t2)}
#cp{display:flex;gap:12px;align-items:flex-start}
#cpsv,#cph{display:block;cursor:crosshair;touch-action:none;border:1px solid #000}
#cpf{display:grid;grid-template-columns:22px 60px;gap:4px 6px;align-items:center}
#cpf input{width:60px}
#cpsw{width:60px;height:56px;border:1px solid #000;display:flex;flex-direction:column}
#cpsw div{flex:1}
#toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:200;max-width:90vw;text-align:center}
#drophint{position:absolute;inset:10px;border:2px dashed var(--a);border-radius:10px;display:none;place-items:center;font-size:16px;color:#fff;background:#4c8dff22;pointer-events:none;z-index:6}
body.hidepanels #panels,body.hideall #panels,body.hideall #tools,body.hideall #options{display:none}
.lrow .nm input{width:100%}
@media (max-width:820px){#panels{position:fixed;right:0;top:98px;bottom:24px;z-index:50;transform:translateX(105%);transition:transform .2s;box-shadow:-10px 0 30px #000a}#panels.show{transform:none}#ptoggle{display:block}#stage{padding:30px}.menu{padding:0 8px}}

/* ---- compact, resizable tabbed panels ---- */
:root{--pw:250px}
#panels{width:var(--pw);position:relative;overflow:hidden;font-size:11px}
#pres{position:absolute;left:0;top:0;bottom:0;width:5px;cursor:ew-resize;z-index:6}#pres:hover,#pres.drag{background:#4c8dff66}
.pgroup{display:flex;flex-direction:column;border-bottom:1px solid #111;flex:none;min-height:23px;overflow:hidden}
.pgroup.grow{flex:1 1 auto;min-height:140px}.pgroup.hidden{display:none}
.pgroup.col{height:auto!important;flex:none!important;min-height:0}.pgroup.col .pbody,.pgroup.col .pgrip{display:none}
.ptabs{display:flex;height:23px;flex:none;background:#2a2a2d;align-items:stretch;user-select:none}
.ptabs span{padding:0 9px;line-height:23px;color:#8d8d93;cursor:pointer;border-right:1px solid #1d1d1f;white-space:nowrap}
.ptabs span.on{background:var(--p2);color:#eee;font-weight:600}.ptabs span.hid{display:none}
.ptabs .pmin{margin-left:auto;padding:0 8px;line-height:23px;color:#888;cursor:pointer;font-style:normal}.ptabs .pmin:hover{color:#fff}
.pbody{flex:1;min-height:0;position:relative;overflow:hidden}
.pbody>.panel{display:none;height:100%;border:0;min-height:0;overflow:auto}
.pbody>.panel.on{display:flex;flex-direction:column}
.pgrip{height:4px;flex:none;cursor:ns-resize;background:#1c1c1f}.pgrip:hover,.pgrip.drag{background:#4c8dff88}
#cpanel{display:flex;gap:6px;padding:6px;flex:1;min-height:60px}
#cswb{position:relative;width:34px;flex:none}
#cswb .sw{position:absolute;width:20px;height:20px;border:1px solid #000;box-shadow:0 0 0 1px #888;cursor:pointer}
#cfg{left:0;top:0;z-index:2}#cbg{left:11px;top:11px}
#cswb .sw.act{box-shadow:0 0 0 1px #000,0 0 0 2px #fff}
#cswb .ci{position:absolute;font-size:11px;color:#aaa;cursor:pointer;line-height:1}#cswap{left:22px;top:0}#cdef{left:0;top:34px}
#csv{flex:1;min-width:60px;height:100%;cursor:crosshair;border:1px solid #111;touch-action:none}
#chue{width:20px;flex:none;height:100%;cursor:ns-resize;touch-action:none}
#csliders{display:flex;gap:4px;align-items:center;padding:0 6px 6px;flex:none}
#csliders input{width:38px;padding:1px 3px;text-align:right}#csliders #hex{width:62px;text-align:left}
#pnSwatch #swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(16px,1fr));gap:2px;padding:6px}
#swatches div{aspect-ratio:1;border:1px solid #0006;cursor:pointer}
#swatches .add{display:grid;place-items:center;color:#aaa;background:#333;font-size:11px}
#pnNav{padding:6px}#navc{width:100%;height:auto;max-height:calc(100% - 26px);object-fit:contain;display:block;background:#111;cursor:pointer;touch-action:none}
.navz{display:flex;gap:4px;align-items:center;margin-top:4px}.navz input{flex:1;width:auto}
#pnHist{padding:6px}#histc{width:100%;height:100%;min-height:50px;display:block;background:#161618}
#pnInfo{padding:6px 8px}
#info{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:1px 8px;font-variant-numeric:tabular-nums}
#histPanel .list,#layerPanel .list,#pnPaths .list{flex:1;min-height:0;max-height:none;overflow-y:auto}
.hrow{padding:2px 6px;font-size:11px}
.lctl{padding:3px 6px;gap:5px}.lctl select{font-size:11px;padding:1px 2px}.lctl .n{width:40px}
.lrow{padding:2px 4px;gap:4px}
.lrow canvas,.lrow .tt{width:32px;height:24px}.lrow .tt{font-size:13px}
.eye{width:18px;height:20px}.eye .ico{width:14px;height:14px}
.lbtns{padding:3px;gap:2px;flex:none}.lbtns button{padding:1px 5px;font-size:11px;min-width:22px}
#cp{gap:12px}#cpf{grid-template-columns:18px 54px 26px 18px 54px 18px;gap:4px 4px}#cpf input{width:54px}#cpf .u{color:#888}
#cpsw{width:70px;height:62px}#cpbtns{display:flex;flex-direction:column;gap:6px;margin-top:8px}
input.n::-webkit-inner-spin-button,input.n::-webkit-outer-spin-button,#csliders input::-webkit-inner-spin-button,#csliders input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input.n,#csliders input{-moz-appearance:textfield}
#csliders input{width:34px}.lctl .n{width:38px}
.tool{width:38px;height:33px}.tool svg{width:21px;height:21px;stroke-width:1.55}
#tools{width:50px}.tool.on{background:#505a70;box-shadow:inset 0 0 0 1px #6c7aa0}
.lbtns{flex-wrap:nowrap!important;justify-content:space-between!important}.lbtns button{display:grid;place-items:center;padding:2px 0;flex:1;min-width:0;max-width:30px}.lbtns .ico{width:16px;height:16px}
#lkA .ico,#lkAll .ico{width:14px;height:14px}#cswb .ci .ico{width:12px;height:12px}
#flyout .fi .ico{width:18px;height:18px}
@media (max-width:820px){#pres{display:none}}
</style></head>
<body class="rulers">
<div id="menubar"><div id="logo"><svg width="20" height="20" viewBox="0 0 24 24"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs><path d="M12 2l9 5v10l-9 5-9-5V7z" fill="url(#lg)"/><path d="M9.5 17V7.5h3a2.6 2.6 0 0 1 0 5.2h-3" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div id="menus"></div><button id="ptoggle">Panels</button></div>
<div id="options"></div>
<div id="tabs"></div>
<div id="main">
 <div id="tools"></div>
 <div id="wrap"><div id="viewport"><div id="stage"><canvas id="view"></canvas></div></div><div id="rulerT"></div><div id="rulerL"></div><canvas id="overlay"></canvas><div id="drophint">Drop images: on the canvas = place as layer · on the tab bar = open</div></div>
 <div id="panels"><div id="pres" title="Drag to resize panels"></div>
  <div class="pgroup" id="gColor" data-h="250"><div class="ptabs"><span data-tab="pnColor" class="on">Color</span><span data-tab="pnSwatch">Swatches</span><i class="pmin" title="Collapse / expand">–</i></div>
   <div class="pbody"><div class="panel on" id="pnColor"><div id="cpanel"><div id="cswb"><div class="sw" id="cfg" title="Foreground (click again for Color Picker)"></div><div class="sw" id="cbg" title="Background (click again for Color Picker)"></div><span class="ci" id="cswap" title="Swap colors (X)">⇄</span><span class="ci" id="cdef" title="Default colors (D)">◩</span></div><canvas id="csv"></canvas><canvas id="chue"></canvas></div>
    <div id="csliders"></div></div>
    <div class="panel" id="pnSwatch"><div id="swatches"></div></div></div><div class="pgrip"></div></div>
  <div class="pgroup col" id="gNav" data-h="190"><div class="ptabs"><span data-tab="pnNav" class="on">Navigator</span><span data-tab="pnHist">Histogram</span><span data-tab="pnInfo">Info</span><i class="pmin">–</i></div>
   <div class="pbody"><div class="panel on" id="pnNav"><canvas id="navc" width="256" height="150"></canvas><div class="navz"><button class="ib" id="navout">−</button><input type="range" id="navz" min="-460" max="350"><button class="ib" id="navin">+</button></div></div>
    <div class="panel" id="pnHist"><canvas id="histc" width="256" height="80"></canvas></div>
    <div class="panel" id="pnInfo"><div id="info"></div></div></div><div class="pgrip"></div></div>
  <div class="pgroup" id="gHistory" data-h="130"><div class="ptabs"><span data-tab="histPanel" class="on">History</span><i class="pmin">–</i></div>
   <div class="pbody"><div class="panel on" id="histPanel"><div class="list" id="history"></div></div></div><div class="pgrip"></div></div>
  <div class="pgroup grow" id="gLayers"><div class="ptabs"><span data-tab="layerPanel" class="on">Layers</span><span data-tab="pnPaths">Paths</span><i class="pmin">–</i></div>
   <div class="pbody"><div class="panel on" id="layerPanel">
    <div class="lctl"><select id="blend" title="Blend mode"></select><span>Opacity</span><input type="range" id="lop" min="0" max="100"><input class="n" type="number" id="lopn" min="0" max="100"></div>

const WF=window.parent!==window&&location.hash==='#wf';
function wfPost(m){try{window.parent.postMessage(Object.assign({wf:1},m),'*')}catch(_){}}
function wfProject(){return JSON.stringify({app:'pixelforge',v:2,name:baseName(),w:D.w,h:D.h,active:D.active,guides:S.guides,layers:D.layers.map(l=>({name:l.name,visible:l.visible,opacity:l.opacity,blend:l.blend,lockA:l.lockA,lockAll:l.lockAll,maskOn:l.maskOn,text:l.text,fx:l.fx,data:l.c.toDataURL(),mask:l.mask?l.mask.toDataURL():null})),paths:D.paths||[]})}
function wfSave(asCopy){if(!D)return;if(TB)commitText();if(TF)tfCommit();const e=DOCS[cur];if(!e.wfKey)e.wfKey='d'+Date.now()+Math.random().toString(36).slice(2);
 let png;try{png=composite().toDataURL('image/png')}catch(_){toast('Could not save this image');return}
 wfPost({type:'save',docKey:e.wfKey,id:asCopy?null:(e.wfId||null),name:baseName(),png,w:D.w,h:D.h,project:wfProject(),hIdx});toast('Saving to the Library…')}
async function wfOpenProject(j,name,id){const d={w:j.w,h:j.h,layers:[],active:0};for(const L of j.layers){const img=await loadImg(L.data),l=mkLayer(L.name,d);Object.assign(l,{visible:L.visible,opacity:L.opacity,blend:L.blend,lockA:!!L.lockA,lockAll:!!L.lockAll,maskOn:L.maskOn!==false,text:L.text||null,fx:L.fx||null});cx(l.c).drawImage(img,0,0);if(L.mask){l.mask=mk(d.w,d.h);cx(l.mask).drawImage(await loadImg(L.mask),0,0)}d.layers.push(l)}
 d.active=clamp(j.active|0,0,d.layers.length-1);d.paths=j.paths||[];d.pathIdx=-1;addDoc(d,name,'Open from Library');DOCS[cur].wfId=id;if(j.guides){S.guides=j.guides;overlayRq()}}
async function wfOpenImage(src,name,id){const img=await loadImg(src),d={w:img.naturalWidth,h:img.naturalHeight,layers:[],active:0},l=mkLayer(name,d);cx(l.c).drawImage(img,0,0);d.layers.push(l);addDoc(d,name,'Open from Library');DOCS[cur].wfId=id}
if(WF){MENUS[0][1].unshift(['Save to Worldforge Library','Ctrl+S',()=>wfSave(false)],['Save to Library as a Copy','',()=>wfSave(true)],['Open from Library…','',()=>wfPost({type:'pick'})],'-');
 const ps=MENUS[0][1].find(x=>Array.isArray(x)&&x[2]===savePSD);if(ps)ps[1]='';
 addEventListener('message',async e=>{if(e.source!==window.parent||!e.data||!e.data.wf)return;const m=e.data;
  if(m.type==='open'){const have=DOCS.findIndex(x=>x.wfId&&x.wfId===m.id);if(have>=0){activate(have);toast('“'+m.name+'” is already open');return}
   try{if(m.project)await wfOpenProject(JSON.parse(m.project),m.name,m.id);else await wfOpenImage(m.png,m.name,m.id);toast('Opened “'+m.name+'” from the Library')}catch(_){toast('Could not open that file')}}
  if(m.type==='saved'){const i=DOCS.findIndex(x=>x.wfKey===m.docKey);if(i>=0){const x=DOCS[i];x.wfId=m.id;if(i===cur){x.name=m.name;S.docName=m.name;markSaved()}else x.saved=m.hIdx}toast('Saved “'+m.name+'” to the Library')}
  if(m.type==='new')newDoc(m.w||1024,m.h||1024,m.fill||null,m.name||undefined);
  if(m.type==='cmd-save')wfSave(false)})}

/* ============ init ============ */
$('#fontlist').innerHTML=['Arial','Arial Black','Helvetica','Segoe UI','Roboto','Inter','Georgia','Times New Roman','Garamond','Palatino Linotype','Courier New','Consolas','Verdana','Tahoma','Trebuchet MS','Impact','Comic Sans MS','Lucida Console','Futura','Gill Sans','system-ui','serif','sans-serif','monospace','cursive'].map(f=>`<option value="${f}">`).join('');
try{Object.assign(S,JSON.parse(localStorage.getItem('pf-prefs')||'{}'))}catch(_){}document.body.classList.toggle('rulers',S.rulers);
loadPanels();applyGroupSizes();buildMenus();buildTools();buildSwatches();buildColorSliders();updateColors();
newDoc(1280,800,'#ffffff');setTool('brush');if(WF)wfPost({type:'ready'});
setTimeout(()=>toast('Welcome to Pixelforge Studio · open images from File or drop them here · press ? for shortcuts'),400);

</script>
</body></html>
